name: Deploy to GitHub Pages

# `main` pushes and manual dispatch build and publish. A pull request runs the
# verification steps only: the publish permissions live on a job that a pull
# request never reaches, so untrusted code has no way to obtain them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two deploys must never overlap. Cancelling in progress would be the default, and
# that is wrong here: it can interrupt a publish partway and leave the live site
# serving a half-written artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck, production build and the export verification. This is the same
      # command used locally, so a green run here means the same thing a green run
      # on a laptop means.
      - name: Check
        run: pnpm check

      - name: Build for GitHub Pages
        env:
          # A project Pages site is served from /<repo>/. The build emits absolute
          # asset paths, so without this every /static/... request 404s.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Disable Jekyll processing
        # Jekyll skips files and directories whose names start with an underscore.
        # The build output has none today, so this is a guarantee, not a fix.
        run: touch dist/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # A pull request gets the build job and nothing else. The permissions below
    # exist only on this job, so a pull request has no path to them at all —
    # which is stronger than guarding a step with an `if:`.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the artifact uploaded by the build job in this same run; no explicit
      # download step is needed.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
